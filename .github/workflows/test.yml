name: Validate pregnancy dating calculator
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator and site checks
        run: node --check assets/js/app.js && node --check assets/js/calculator.js && node --check assets/js/date-utils.js && node --test
